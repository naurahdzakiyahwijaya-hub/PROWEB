<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar javascript</title>
</head>
<body>
    <h2>Daftar pengunjung</h2>
    <p id="pengunjung" ></p>

    <script>
        let nama = prompt("Nama anda siapa?");
        document.getElementById("pengunjung").innerHTML = "Halo "+nama+", salam kenal";
    </script>
</body>
</html>
