<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Proweb 2</title>
    <link rel="stylesheet" href="form.css"/>
</head>
<body>
     <fieldset>
        <legend>Akun</legend>
        <form action="#" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <label for="confirm_password">Konfirmasi Password:</label>
            <input type="password" id="confirm_password" 
            name="confirm_password" required> <br><br>
             </fieldset>   

            <fieldset>
                <legend>Data</legend>
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" required><br>
                <label for="alamat">Alamat:</label>
                <textarea id="alamat" name="alamat" required></textarea><br>
                <label for="gender">Jenis Kelamin</label>
        <input type="radio" id="gender" value="Laki-laki" name="gender">
        <label style="display: inline-block; margin-right: 10px;"for="gender">Laki-laki</label>
        <input type="radio" id="gender" value="Perempuan" name="gender">
        <label style="display: inline-block; margin-right: 10px;"
for="gender">Perempuan</label><br><br>

<select id="agama" name="agama" required>
                    <option value="">Pilih Agama</option>
                    <option value="islam">Islam</option>
                    <option value="kristen">Kristen</option>
                    <option value="katolik">Katolik</option>
                    <option value="hindu">Hindu</option>
                    <option value="buddha">Buddha</option>
                </select><br><br>
        
                
                <label for="informasi-yang-disukai">Kesukaan:</label>
               
                <input type="checkbox" id="informasi-yang-disukai" name="Membaca" value="Membaca" required>
                <label style="display: inline-block; margin-right: 10px;"for="informasi-yang-disukai">Membaca</label><br>

                <input type="checkbox" id="informasi-yang-disukai" name="Olahraga" value="Olahraga" required>
                <label style="display: inline-block; margin-right: 10px;"for="informasi-yang-disukai">Olahraga</label><br>

                <input type="checkbox" id="informasi-yang-disukai" name="Traveling" value="Traveling" required>
                <label style="display: inline-block; margin-right: 10px;"for="informasi-yang-disukai">Traveling</label><br>

                <input type="checkbox" id="informasi-yang-disukai" name="Seni" value="Seni" required>
                <label style="display: inline-block; margin-right: 10px;"for="informasi-yang-disukai">Seni</label>
               <br><br>

        <input type="submit" value="Submit"><input type="reset" value="Reset">
   
    </form>     
    </fieldset>
</body>
</html>
